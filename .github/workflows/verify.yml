name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A lockfile is not yet available in this repository. TypeScript is
      # pinned exactly in package.json; switch to npm ci when it is committed.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: docker build --target verify .
